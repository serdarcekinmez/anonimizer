name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Full gate
        env:
          ANONIMIZER_CI: "1"   # disposable runner; the bubblewrap wrapper is for development machines
        run: python tools/gate.py --full
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report-${{ matrix.python-version }}
          path: docs/evidence/gate-report-full.json
